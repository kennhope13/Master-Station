<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Station Monitor — Kết nối</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0f1e;
      --surface:   #0f172a;
      --card:      #1e293b;
      --border:    #334155;
      --accent:    #3b82f6;
      --accent-glow: rgba(59,130,246,0.35);
      --success:   #22c55e;
      --error:     #ef4444;
      --text:      #f1f5f9;
      --text-muted:#94a3b8;
      --radius:    14px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridPan 30s linear infinite;
      pointer-events: none;
    }

    @keyframes gridPan {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    /* Glow blob */
    .glow-blob {
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: blobPulse 4s ease-in-out infinite alternate;
    }
    @keyframes blobPulse {
      from { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      to   { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* Main card */
    .container {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      box-shadow:
        0 0 0 1px rgba(59,130,246,0.1),
        0 25px 50px rgba(0,0,0,0.5),
        0 0 80px rgba(59,130,246,0.06);
      animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo-wrap {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px var(--accent-glow);
      flex-shrink: 0;
    }
    .logo-icon svg { width: 26px; height: 26px; fill: white; }
    .logo-text h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .logo-text p  { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin-bottom: 28px;
    }

    /* Form */
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 20px;
    }
    .input-wrap .input-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', monospace;
      font-size: 14px;
      padding: 13px 14px 13px 40px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: var(--text-muted); }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    input.error { border-color: var(--error); }

    /* Connect button */
    .btn-connect {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      border: none; border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(59,130,246,0.4);
      position: relative; overflow: hidden;
    }
    .btn-connect:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(59,130,246,0.5); }
    .btn-connect:active { transform: translateY(0); }
    .btn-connect:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Status */
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .status.connecting {
      display: flex;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.3);
      color: #93c5fd;
    }
    .status.success {
      display: flex;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      color: #86efac;
    }
    .status.error {
      display: flex;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }

    /* Status dot pulse */
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-blue { background: #3b82f6; animation: dotPulse 1s ease-in-out infinite; }
    .dot-green { background: var(--success); }
    .dot-red { background: var(--error); }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.7); }
    }

    /* Hint */
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }
    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }

    /* Examples */
    .examples {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ex-chip {
      font-size: 11px;
      padding: 4px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .ex-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .drag-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 40px;
      background: transparent;
      -webkit-app-region: drag;
      z-index: 9990;
    }
  </style>
</head>
<body>
  <div class="drag-bar"></div>
  <div class="glow-blob"></div>

  <div class="container">
    <div class="card">
      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14l-3-3 1.41-1.41L11 12.17l4.59-4.58L17 9l-6 6z"/></svg>
        </div>
        <div class="logo-text">
          <h1>Station Monitor</h1>
          <p>Hệ thống giám sát trạm điện</p>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Form -->
      <label for="serverInput">Địa chỉ máy chủ</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </span>
        <input
          id="serverInput"
          type="text"
          placeholder="localhost hoặc 192.168.1.100"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <!-- Examples -->
      <div style="margin-bottom:20px">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">Ví dụ nhanh:</div>
        <div class="examples">
          <span class="ex-chip" onclick="fillExample('localhost')">LOCAL: localhost</span>
          <span class="ex-chip" onclick="fillExample('192.168.1.100')">LAN: 192.168.1.100</span>
        </div>
      </div>

      <!-- Button -->
      <button class="btn-connect" id="connectBtn" onclick="doConnect()">
        <div class="spinner" id="spinner"></div>
        <span id="btnLabel">Kết nối</span>
      </button>

      <!-- Status -->
      <div class="status" id="status">
        <div class="dot" id="statusDot"></div>
        <span id="statusMsg"></span>
      </div>

      <!-- Hint -->
      <div class="hint" style="margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05)">
        <div style="margin-bottom: 8px;">Nhập địa chỉ máy chủ trạm điện. Mặc định là <b>localhost</b>.</div>
        <div style="margin-top: 8px; font-size: 11px; color: var(--text-muted);">
          * Đảm bảo dịch vụ Backend và Frontend đang hoạt động trên máy chủ.
        </div>
      </div>
    </div>
  </div>

  <script>
    let invoke;
    if (window.__TAURI__) {
      if (window.__TAURI__.core && typeof window.__TAURI__.core.invoke === 'function') {
        invoke = window.__TAURI__.core.invoke;
      } else if (typeof window.__TAURI__.invoke === 'function') {
        invoke = window.__TAURI__.invoke;
      } else if (window.__TAURI__.tauri && typeof window.__TAURI__.tauri.invoke === 'function') {
        invoke = window.__TAURI__.tauri.invoke;
      } else {
        invoke = async (cmd, args) => {
          console.warn("Could not find invoke function in window.__TAURI__:", cmd, args);
          throw new Error("Tauri invoke function not found.");
        };
      }
    } else {
      invoke = async (cmd, args) => {
        console.warn("Tauri API not injected. Command ignored:", cmd, args);
        throw new Error("Tauri API is not available.");
      };
    }

    // Điền ví dụ
    function fillExample(ip) {
      document.getElementById('serverInput').value = ip;
      document.getElementById('serverInput').focus();
    }

    // Kiểm tra URL hợp lệ
    function validateUrl(raw) {
      const normalized = raw.startsWith('http') ? raw : `http://${raw}`;
      try {
        const u = new URL(normalized);
        // Thêm port mặc định nếu không có
        if (!u.port) u.port = '5173';
        return u.toString();
      } catch {
        return null;
      }
    }

    // Trạng thái UI
    function setConnecting() {
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('btnLabel').textContent = 'Đang kết nối...';
      document.getElementById('connectBtn').disabled = true;
      showStatus('connecting', 'Đang kết nối tới máy chủ...');
    }
    function setIdle() {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('btnLabel').textContent = 'Kết nối';
      document.getElementById('connectBtn').disabled = false;
    }
    function showStatus(type, msg) {
      const el = document.getElementById('status');
      const dot = document.getElementById('statusDot');
      const msgEl = document.getElementById('statusMsg');
      el.className = 'status ' + type;
      dot.className = 'dot ' + (type === 'connecting' ? 'dot-blue' : type === 'success' ? 'dot-green' : 'dot-red');
      msgEl.textContent = msg;
    }

    async function doConnect() {
      const raw = document.getElementById('serverInput').value.trim();
      if (!raw) {
        document.getElementById('serverInput').classList.add('error');
        showStatus('error', 'Vui lòng nhập địa chỉ máy chủ.');
        setTimeout(() => document.getElementById('serverInput').classList.remove('error'), 1500);
        return;
      }

      // Chuẩn hoá URL, thêm port 5173 nếu không có
      let normalized = raw.startsWith('http') ? raw : `http://${raw}`;
      try {
        const u = new URL(normalized);
        if (!u.port) {
          u.port = '5173';
          normalized = u.toString().replace(/\/$/, '');
        }
      } catch {
        showStatus('error', 'Địa chỉ không hợp lệ. Ví dụ: 192.168.1.100');
        return;
      }

      setConnecting();

      try {
        // Lưu URL và điều hướng ngay lập tức (không chạy fetch kiểm tra tránh lỗi CORS/mạng)
        showStatus('success', 'Đang kết nối tới máy chủ...');
        await invoke('connect_to_server', { url: normalized });
      } catch (err) {
        showStatus('error', `Không thể kết nối: ${err}`);
        setIdle();
      }
    }

    async function openTailscale() {
      try {
        await invoke('open_url', { url: 'https://tailscale.com/download' });
      } catch (err) {
        alert('Không thể mở trình duyệt: ' + err);
      }
    }

    async function runTailscaleInstaller() {
      try {
        showStatus('connecting', 'Đang khởi chạy trình cài đặt Tailscale...');
        await invoke('install_tailscale');
        showStatus('success', 'Đã mở trình cài đặt Tailscale trên Windows!');
        setTimeout(setIdle, 3000);
      } catch (err) {
        showStatus('error', `Lỗi: ${err}`);
        setTimeout(setIdle, 4000);
      }
    }

    // Enter để kết nối
    document.getElementById('serverInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doConnect();
    });

    // Tự động điền URL đã lưu (nếu có, Rust sẽ navigate trước khi HTML này load)
    // Nhưng nếu vẫn hiển thị trang này nghĩa là chưa có URL hoặc kết nối thất bại
    window.addEventListener('load', async () => {
      try {
        const savedUrl = await invoke('get_server_url');
        if (savedUrl) {
          // Extract IP từ URL để hiển thị
          const u = new URL(savedUrl);
          document.getElementById('serverInput').value = u.hostname;
          showStatus('error', 'Không thể kết nối tới máy chủ đã lưu. Kiểm tra lại.');
        } else {
          document.getElementById('serverInput').value = 'localhost';
        }
      } catch {
        document.getElementById('serverInput').value = 'localhost';
      }
    });
  </script>
</body>
</html>
