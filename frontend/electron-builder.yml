appId: com.masterstation.desktop
productName: Master Station
directories:
  output: dist-electron
files:
  - dist/**/*
  - electron/main.cjs
  - electron/preload.cjs
  - package.json
extraResources:
  - from: ../backend_published/win-x64
    to: backend_published
  - from: ../pg_portable
    to: pg_portable
  - from: ../go2rtc
    to: go2rtc
  - from: ../vc_redist.x64.exe
    to: vc_redist.x64.exe
  - from: resources/tailscale-setup.exe
    to: tailscale-setup.exe
linux:
  target:
    - deb
    - AppImage
  category: Utility
  maintainer: StationOS Team <support@stationos.com>
win:
  icon: public/favico/worldmonitor-icon-1024.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  shortcutName: "Master Station"
  include: electron/installer.nsh
