# Central Server — chạy trên cloud/VPS
# docker-compose -f docker-compose.central.yml up -d

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: StationOS_Central
      POSTGRES_USER: stationos_central
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_central_data:/var/lib/postgresql/data
    ports:
      - "6432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      Mode: Central
      ConnectionStrings__Postgres: "Host=postgres;Database=StationOS_Central;Username=stationos_central;Password=${DB_PASSWORD}"
      ASPNETCORE_URLS: http://+:5000
    ports:
      - "6000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
    environment:
      VITE_API_URL: ${BACKEND_URL}
    ports:
      - "80:80"

volumes:
  pg_central_data:
