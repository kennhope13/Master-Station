# Docker Compose for Development TimescaleDB (PostgreSQL)
# Run to start local DB: docker compose -f docker-compose.db.yml up -d
# To stop: docker compose -f docker-compose.db.yml down

version: '3.8'
name: stationos-central

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: stationos-central-db
    environment:
      POSTGRES_DB: StationOS_Central
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - stationos_central_pg_data:/var/lib/postgresql/data
    ports:
      - "6432:5432"
    restart: unless-stopped

volumes:
  stationos_central_pg_data:
